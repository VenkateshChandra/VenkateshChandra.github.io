<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Under Active Development | Trends For Sale (TFS)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../common_css/design_system.css">
  <link rel="stylesheet" href="../common_css/navbar.css">
  <style>
    .coming-page-body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: var(--bg-primary);
      position: relative;
      overflow: hidden;
    }
    .coming-glow {
      position: absolute;
      width: 600px;
      height: 400px;
      background: radial-gradient(circle, var(--accent-cyan-glow) 0%, rgba(99, 102, 241, 0.15) 50%, transparent 70%);
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }
    .coming-card {
      position: relative;
      z-index: 1;
      max-width: 520px;
      width: 100%;
      text-align: center;
      padding: 48px 36px;
    }
    .coming-icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-md);
      background: rgba(0, 229, 255, 0.12);
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 0 20px var(--accent-cyan-glow);
    }
    .coming-icon-wrap svg {
      width: 32px;
      height: 32px;
    }
    .coming-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 12px;
      background: var(--gradient-brand);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .coming-desc {
      font-size: 1rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .coming-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body class="coming-page-body">
  <div class="coming-glow"></div>
  <div class="glass-card coming-card">
    <div class="coming-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
    </div>
    <span class="badge badge-pulse" style="margin-bottom: 16px;">Feature In Progress</span>
    <h1 class="coming-title">Engineering In Flight</h1>
    <p class="coming-desc">
      We are actively crafting this module with high-performance Web APIs and real-time visualization. In the meantime, explore our live Web Serial Terminal or return home.
    </p>
    <div class="coming-actions">
      <a href="../serial_term/serial_term.html" class="btn btn-primary">
        🚀 Launch Serial Terminal
      </a>
      <a href="../home/home_page.html" class="btn btn-secondary">
        Return to Home
      </a>
    </div>
  </div>
</body>
</html>
