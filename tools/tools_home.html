<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TFS Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../home/home_page.css">
  <link rel="stylesheet" href="../home/home_page_mobile.css">
    <link rel="stylesheet" href="../common_css/header_and_nav.css">
</head>
<body>
<div id="header-placeholder"></div>
<script>
fetch('../common_pages/header_and_nav.html')
  .then(r => r.text())
  .then(html => {
    document.getElementById('header-placeholder').innerHTML = html;
    // Optionally load header.js here
    var script = document.createElement('script');
    script.src = '../common/header.js';
    document.body.appendChild(script);
  });
</script>
<script src="../common_js/header_and_nav.js"></script>
<script src="../home/home_page.js"></script>
</body>
</html>
